_ > nanoagent.plugin.v0001.ManifestConfig:
id: concept-cooccurrence-query
name: Concept Co-occurrence Query
version: 0.1.4
status: ready
spec: nanoagent.plugin/v0001

runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: []
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: [workspace]

# One entry per contract.Tool; its input and output classes are contract.TOOLS's.
tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  describe_corpus:
    description: Count a bundled corpus's papers and concepts, its distinct co-occurring pairs and pair occurrences, and the hash rows a sketch may use
  build_sketch:
    description: Stream a corpus's concept pairs into a Count-Min Sketch within the memory budget, save the pairs it estimates at min_count or more ranked by estimate, and return their count and histogram
  count_pairs:
    description: Count a rank range of a sketch's candidates exactly, within the query budget, and return the pairs that qualify
  exact_frequent_pairs:
    description: Count every co-occurring pair of a corpus exactly and list those that qualify, the task's reference

# One entry per contract.Task; its input and output classes are contract.TASKS's.
tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  find-frequent-pairs:
    description: Find every concept pair that appears together in at least min_count papers, within a memory budget and a query budget
    runner: agent
    tools: [describe_corpus, build_sketch, count_pairs]
    reference: exact_frequent_pairs
    instructions: |-
      Find every pair of concepts that appear together in at least min_count papers of the dataset. A Count-Min Sketch proposes candidate pairs and count_pairs counts them exactly.
      Keep each step short: every reply is limited to about 2,000 tokens, and a reply that runs out before calling a tool ends the task, so call a tool after brief reasoning instead of computing estimates by hand.
      Two budgets apply. memory_budget is the most counters all your sketches may use together: it is cumulative over every build_sketch call, a sketch costs width times depth, and building the same sketch again costs nothing. query_budget is the most distinct pairs count_pairs may count over all its calls. Pass dataset, min_count and both budgets to every tool exactly as given.
      Procedure: call describe_corpus. After describe_corpus, choose width and depth in one sentence and call build_sketch at once. Use its histogram, not calculation, to decide how many ranks to count and whether to build another sketch. Then call count_pairs on rank ranges, starting at rank 1; a refused call says the largest count that fits.
      An estimate is never below a pair's true count, so every qualifying pair is a candidate; candidates are ranked by estimate, highest first, and the histogram groups them by estimate with their rank ranges. More width means fewer collisions, so estimates come closer to the truth. More depth takes the minimum over more rows, but at a fixed memory budget each row is narrower. A sketch may have more candidates than the query budget.
      The workspace may already hold this task's sketches and counts from an earlier run: they carry over, and count_pairs returns a skipped pair that qualified again, with previously_counted true.
      Submit every pair any count_pairs call returned as qualifying, each once, with a and b exactly as returned, and no other pair: one pair that does not qualify makes the answer wrong, and it passes only with at least min_recall of all qualifying pairs. If no call returned a qualifying pair, submit an empty list: that is the correct answer when no pair qualifies.
