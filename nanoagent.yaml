_ > nanoagent.plugin.v0001.ManifestConfig:
id: concept-cooccurrence-query
name: Concept Co-occurrence Query
version: 0.1.0
status: ready
spec: nanoagent.plugin/v0001

runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: []
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: [workspace]

# One entry per contract.Tool; its input and output classes are contract.TOOLS's.
tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  describe_corpus:
    description: Count a bundled corpus's papers and concepts, its distinct co-occurring pairs and pair occurrences, and the hash rows a sketch may use
  build_sketch:
    description: Stream a corpus's concept pairs into a Count-Min Sketch within the memory budget, save the pairs it estimates at min_count or more ranked by estimate, and return their count and histogram
  count_pairs:
    description: Count a rank range of a sketch's candidates exactly, within the query budget, and return the pairs that qualify
  exact_frequent_pairs:
    description: Count every co-occurring pair of a corpus exactly and list those that qualify, the task's reference

# One entry per contract.Task; its input and output classes are contract.TASKS's.
tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  find-frequent-pairs:
    description: Find every concept pair that appears together in at least min_count papers, within a memory budget and a query budget
    runner: agent
    tools: [describe_corpus, build_sketch, count_pairs]
    reference: exact_frequent_pairs
    instructions: |-
      Find every pair of concepts that appear together in at least min_count papers of the dataset. A Count-Min Sketch proposes candidate pairs and count_pairs confirms them. Two budgets apply. memory_budget is the most counters all your sketches may use together: it is cumulative over every build_sketch call, so a trial sketch spends counters the final sketch can no longer use. query_budget is the most distinct pairs count_pairs may count over all its calls. Counting every pair is usually far over the query budget.
      Start with describe_corpus: it gives the number of papers and concepts, how many distinct pairs occur together, N (the total pair occurrences in the stream: each paper's concept pairs, summed), and how many hash rows a sketch may use.
      Then call build_sketch with width and depth. The sketch has depth rows of width counters each, width times depth counters in all, charged to memory_budget. Every pair occurrence adds 1 to one counter in each row, chosen by that row's fixed hash. A pair's estimate is the least of its depth counters. An estimate is never below the pair's true count; it is above it when other pairs share its counters. More width spreads the pairs over more counters, so fewer pairs collide and estimates come closer to the truth. More depth takes the minimum over more rows, so a pair is overestimated only if it collides in every row; but at a fixed memory budget each extra row makes every row narrower. The standard bound: with probability at least 1 - e^(-depth), an estimate exceeds the true count by at most e times N divided by width, e being about 2.718.
      build_sketch looks up every pair that occurs in the corpus and keeps as candidates those estimated at min_count or more. Since no estimate is too low, every qualifying pair is a candidate. The candidates are saved in the workspace, ranked by estimate, highest first, because higher estimates are more likely to belong to qualifying pairs. You get back the sketch_id, the counters charged and remaining, how many candidates there are, and a histogram: buckets of candidates by estimate, highest first, each with its lowest and highest estimate, how many candidates it holds, and its rank range, first_rank to last_rank. Building a sketch with the same width and depth again is not charged again. A sketch that would exceed the remaining memory is refused, and the error says the largest width that fits.
      A sketch may have far more candidates than the query budget: counting its top ranks spends the budget on the pairs most likely to qualify, and a sketch with more accurate estimates puts more qualifying pairs near the top. Count candidates with count_pairs: pass the sketch_id, a rank range (start_rank, from 1, and count), and the task's dataset, min_count and query_budget exactly as given. Only pairs no earlier call counted are counted and charged; it returns the qualifying ones with their exact counts, how many pairs it counted and skipped, and how much query budget remains. A range holding more new pairs than the budget allows is refused, and the error says the largest count that fits. Pass min_count and memory_budget to build_sketch exactly as given, too.
      While query budget remains, you may count further ranks, or build another sketch if memory remains and count its ranks; pairs already counted are skipped at no cost.
      Submit every pair any count_pairs call returned as qualifying, each once, with a and b exactly as returned. Submit no other pair: a pair that does not qualify makes the answer wrong, and the answer passes only when it holds at least min_recall of all qualifying pairs. If no count_pairs call returned a qualifying pair, submit an empty list: that is the correct answer when no pair qualifies.
